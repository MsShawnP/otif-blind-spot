# Lailara LLC — Engagement config (DEMO). Canonical demo identity; demo: true so
# the deploy guard ignores it. A real client run uses engagement.yml with the
# client's own OTIF scorecard.
client:
  name: "Cinderhaven Provisions (demo)"
engagement:
  id: "CINDERHAVEN-DEMO"
# Analysis anchor = the demo corpus end (Jan 2023 – Dec 2025). Never today.
as_of_date: "2025-12-31"
prepared_by: "Lailara LLC"
demo: true
basis:
  window_months: 36
  window_label: "Jan 2023 – Dec 2025"
columns:
  shipment_id: "shipment_id"
  ship_date: "ship_date"
  on_time_result: "on_time_result"
  in_full_result: "in_full_result"
  po_units: "po_units"
  shipped_units: "shipped_units"
  otif_fine: "otif_fine"
